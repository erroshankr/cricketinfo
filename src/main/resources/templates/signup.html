<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Register User</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #1e3c72, #2a5298);
      margin: 0;
      padding: 0;
      color: white;
    }

    .container {
      width: 400px;
      margin: 100px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      color: #2c3e50;
      text-align: center;
    }

    h2 {
      margin-bottom: 25px;
    }

    .form-row {
      margin-bottom: 18px;
      text-align: left;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    button {
      background-color: #27ae60;
      padding: 12px;
      width: 100%;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #1e8449;
      transform: scale(1.03);
    }

    .message {
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .success {
      background: #d4edda;
      color: #155724;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
    }

    .checkbox-group {
      background: #f8f9fa;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 10px;
    }

    .checkbox-item {
      padding: 6px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checkbox-item input[type="checkbox"] {
      width: auto;
      margin: 0;
      cursor: pointer;
    }

    .login-link {
      margin-top: 15px;
      font-size: 14px;
    }

    .login-link a {
      color: #2a5298;
      text-decoration: none;
      font-weight: bold;
    }

  </style>
</head>
<body>
<!-- Header -->
<div class="header">
  <h1>🏏 Cricket Info App</h1>
  <a th:href="@{/}">Home</a>
</div>
<div class="container">

  <div th:if="${success}" class="message success" th:text="${success}"></div>
  <div th:if="${error}" class="message error" th:text="${error}"></div>

  <h2>📝 Register User</h2>

  <form th:action="@{/user-create}"
        th:object="${user}"
        method="post">

    <input type="hidden" th:field="*{id}" />

    <div class="form-row">
      <label>Email</label>
      <input type="email" th:field="*{email}">
    </div>

    <div class="form-row">
      <label>Username</label>
      <input type="text" th:field="*{username}">
    </div>

    <div class="form-row">
      <label>Password</label>
      <input type="password" th:field="*{password}">
    </div>

    <div class="form-row">
      <label>Roles (select one or more)</label>
      <div class="checkbox-group">
        <div th:each="role : ${availableRoles}" class="checkbox-item">
          <input type="checkbox" name="selectedRoles" th:value="${role}" th:id="${role}"
                 th:checked="${role == 'USER'}">
          <label th:for="${role}" th:text="${role}" style="display:inline; font-weight:normal;"></label>
        </div>
      </div>
    </div>

    <button type="submit">Register</button>

  </form>

  <div class="login-link">
    Already have an account? <a th:href="@{/login}">Login here</a>
  </div>

</div>

</body>
</html>
