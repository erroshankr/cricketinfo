<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login User</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #1e3c72, #2a5298);
            margin: 0;
            padding: 0;
            color: white;
        }

        .container {
            width: 400px;
            margin: 120px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            color: #2c3e50;
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
        }

        .form-row {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            background-color: #27ae60;
            padding: 12px;
            width: 100%;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #1e8449;
            transform: scale(1.03);
        }

        .message {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .signup-link {
            margin-top: 15px;
            font-size: 14px;
        }

        .signup-link a {
            color: #2a5298;
            text-decoration: none;
            font-weight: bold;
        }
        /* Header */
        .header {
            background: linear-gradient(to right, #1e3c72, #2a5298);
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
        }

        .header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }


    </style>
</head>
<body>
<!-- Header -->
<div class="header">
    <h1>🏏 Cricket Info App</h1>
    <a th:href="@{/}">Home</a>
</div>
<div class="container">

    <div th:if="${success}" class="message success" th:text="${success}"></div>
    <div th:if="${error}" class="message error" th:text="${error}"></div>

    <h2>🔐 Login User</h2>

    <form th:action="@{/login}"
          method="post">

        <div class="form-row">
            <label>Username</label>
            <input type="text" name="username">
        </div>

        <div class="form-row">
            <label>Password</label>
            <input type="password" name="password">
        </div>

        <button type="submit">Login</button>

    </form>

    <div class="signup-link">
        Don't have an account? <a th:href="@{/register}">Register here</a>
    </div>

</div>

</body>
</html>
